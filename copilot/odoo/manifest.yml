name: odoo
type: Backend Service

image:
  build: Dockerfile
  port: 8069

cpu: 2048
memory: 4096
count: 2

environments:
  production:
    variables:
      # Odoo Configuration
      DB_HOST: odoo-db
      DB_PORT: 5432
      DB_USER: odoo
      DB_NAME: odoo
      # POSTGRES_USER: odoo
      # POSTGRES_NAME: odoo

      # Odoo Performance Settings
      WORKERS: 4
      MAX_CRON_THREADS: 2

      # Optional Settings
      ODOO_ADDONS_PATH: /mnt/extra-addons
      ODOO_DATA_DIR: /var/lib/odoo

secrets:
  ADMIN_PASSWORD: /copilot/${COPILOT_APPLICATION_NAME}/${COPILOT_ENVIRONMENT_NAME}/secrets/ADMIN_PASSWORD
  DB_PASSWORD: /copilot/${COPILOT_APPLICATION_NAME}/${COPILOT_ENVIRONMENT_NAME}/secrets/DB_PASSWORD

variables:
  ADMIN_PASSWORD: ${ADMIN_PASSWORD}
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT}
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}
  DB_NAME: ${DB_NAME}
  WORKERS: 4
  MAX_CRON_THREADS: 2

network:
  vpc:
    placement: private
  connect_to:
    odoo-db:
      security_groups: [odoo-db-sg]

storage:
  volumes:
    odoo_data:
      path: /var/lib/odoo
      read_only: false
      efs:
        uid: 1000
        gid: 1000
        root_directory: /
        auth:
          iam: true 